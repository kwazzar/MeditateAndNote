name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref so PR updates don't queue.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + coverage gate
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      SCHEME: MeditateAndNote
      # Coverage floor for the main app target. Set slightly below the
      # currently measured value (33.57%) so natural variance between
      # runners doesn't break the build. Raise this as coverage improves.
      COVERAGE_THRESHOLD: 33.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes | head -5
          xcrun simctl list devices available | head -20

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # Prefer the newest available iPhone so we exercise the
          # iOS SDK the project depends on; fall back to any iPhone.
          PREFERRED=$(xcrun simctl list devices available | \
            awk -F'[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$PREFERRED" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            exit 1
          fi
          echo "Selected simulator: $PREFERRED"
          echo "name=$PREFERRED" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          RESULT_DIR="$RUNNER_TEMP/xcresults"
          mkdir -p "$RESULT_DIR"
          xcodebuild \
            -project MeditateAndNote.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_DIR/test.xcresult" \
            test

      - name: Show coverage
        run: |
          xcrun xccov view --report --only-targets "$RUNNER_TEMP/xcresults/test.xcresult"

      - name: Parse coverage
        id: coverage
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/xcresults/test.xcresult"
          COVERAGE=$(xcrun xccov view --report --only-targets "$RESULT" | python3 -c "
          import sys, re
          for line in sys.stdin:
              m = re.search(r'MeditateAndNote\.app\s+\d+\s+(\d+\.\d+)%', line)
              if m:
                  print(m.group(1))
                  break
          ")
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse MeditateAndNote.app coverage from xcresult"
            exit 1
          fi
          echo "Measured coverage: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

      - name: Enforce coverage threshold
        run: |
          python3 - <<'PY'
          import os
          measured = float(os.environ["COVERAGE"])
          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          print(f"Measured: {measured}%  |  Threshold: {threshold}%")
          if measured < threshold:
              raise SystemExit(
                  f"Coverage gate failed: {measured}% < {threshold}%. "
                  f"Raise COVERAGE_THRESHOLD or add tests."
              )
          print("Coverage gate passed.")
          PY
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
