org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
aiDraftEndpoint=https://meditate-and-note-ai.vercel.app/api/draft
# RevenueCat public SDK key for the Android app. Not a secret - the same key
# ships inside the APK - but it is per-project, so it is kept here and can be
# overridden with -PrevenueCatApiKey=... An empty value leaves the SDK
# unconfigured: the paywall reports "subscriptions unavailable" instead of
# failing. The iOS side reads the same key from MeditateAndNote/Config/*.xcconfig.
# Free testing without a Play Console account: a RevenueCat Test Store key
# (test_...), e.g. ./gradlew :app:assembleDebug -PrevenueCatApiKey=test_...
revenueCatApiKey=
